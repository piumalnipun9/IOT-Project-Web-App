# Mosquitto Configuration for IoT Bulb Control
# Save this as mosquitto.conf and run: mosquitto -c mosquitto.conf

# Allow anonymous connections (for testing only!)
allow_anonymous true

# Standard MQTT listener
listener 1883
protocol mqtt

# WebSocket listener for browser connections
listener 9001
protocol websockets

# Logging
log_dest stdout
log_type all

# Persistence
persistence true
persistence_location /tmp/mosquitto/

# For production, uncomment and configure:
# allow_anonymous false
# password_file /path/to/passwd
# acl_file /path/to/acl.conf
